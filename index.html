<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <title>Hoop Dreams — 16-Bit Basketball Career RPG</title>
  <meta name="description" content="Go from an unknown 16-year-old on a cracked playground court to the GOAT. A free 16-bit basketball career RPG with story choices, minigames and arcade play — right in your browser.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <!-- Social preview (WhatsApp, Instagram, Discord, iMessage…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hoop Dreams">
  <meta property="og:title" content="Hoop Dreams — 16-Bit Basketball Career RPG">
  <meta property="og:description" content="From nobody to the GOAT. Story choices, minigames and 16-bit arcade basketball. Free in your browser.">
  <meta property="og:url" content="https://aquoric.github.io/hoop-dreams/">
  <meta property="og:image" content="https://aquoric.github.io/hoop-dreams/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hoop Dreams: a 16-bit street court at night, a player dunking over a defender">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hoop Dreams — 16-Bit Basketball Career RPG">
  <meta name="twitter:description" content="From nobody to the GOAT. Free in your browser.">
  <meta name="twitter:image" content="https://aquoric.github.io/hoop-dreams/assets/og-image.png">
  <!-- Fonts are optional: the game falls back to system fonts if offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <!-- Release version: GitHub Pages stamps the commit into version.js, which is fetched fresh on every visit.
       Every file below then loads as file?v=<commit>, so after a release browsers never mix old and new files.
       A local copy skips version.js and runs as a "dev build" (fresh files on every load). -->
  <script>if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
  <script>
    window.HD_V = /^[0-9a-f]{7,40}$/.test(window.HD_VERSION || '') ? HD_VERSION.slice(0, 7) : 'dev' + Date.now();
    window.hdLoad = files => files.forEach(f => document.write(/\.css$/.test(f) ? '<link rel="stylesheet" href="' + f + '?v=' + HD_V + '">' : '<script src="' + f + '?v=' + HD_V + '"><\/script>'));
    hdLoad(['css/style.css']);
  </script>
</head>
<body>
  <div id="app">
    <div id="bg"></div>
    <div id="screen" class="screen"></div>
    <div class="corner" id="corner">
      <button class="icon-btn" id="muteBtn" title="Mute / unmute">🔊</button>
      <button class="icon-btn" id="setBtn" title="Settings">⚙</button>
    </div>
    <div id="modals"></div>
    <div id="toasts"></div>
    <div id="fx"></div>
  </div>
  <noscript><p style="color:#fff;padding:2rem">Hoop Dreams needs JavaScript enabled.</p></noscript>

  <script>
    hdLoad([
      // The pause owns the game clock: it loads before everything else
      'js/pause.js',
      // Game content (edit these to add teams, players and story)
      'js/data-game.js',
      'js/data-leagues.js',
      'js/data-nbl.js',
      'js/data-story.js',
      'js/data-story-ch1.js',
      'js/data-story-ch2.js',
      'js/data-story-ch2-scenes.js',
      'js/data-venues.js',
      'js/data-talk.js',
      'js/data-talk-lines.js',
      'js/data-usa.js',
      'js/data-features.js',
      'js/data-ch3-world.js',
      'js/data-story-ch3.js',
      'js/data-story-ch3-overseas.js',
      'js/data-story-ch3-dev.js',
      'js/data-story-ch3-scenes.js',
      'js/data-story-ch4.js',
      'js/data-story-ch4-scenes.js',
      'js/data-prospects.js',
      'js/data-arcs.js',
      // Engine
      'js/art.js',
      'js/pixel.js',
      'js/audio.js',
      'js/engine.js',
      'js/balance.js',
      'js/match.js',
      'js/season.js',
      'js/arcade.js',
      'js/cutscene.js',
      'js/cs-plays.js',
      'js/story-fx.js',
      'js/ui.js',
      'js/attr-tips.js',
      'js/usa.js',
      'js/draft.js',
      'js/features.js',
      'js/rankings.js',
      'js/tutorial.js',
      'js/main.js'
    ]);
  </script>
</body>
</html>
